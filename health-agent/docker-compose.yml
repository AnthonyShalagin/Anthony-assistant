version: "3.8"

services:
  health-agent:
    build: .
    container_name: hermes-health-agent
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/data/health.db
      - TZ=America/New_York
    volumes:
      - health-data:/app/data
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp:size=10M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  health-data:
    driver: local
